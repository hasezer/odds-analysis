name: Snapshot odds

on:
  schedule:
    # 06:00 UTC opening run, then every 2 h 08-22 UTC (keep in sync with RUN_HOURS_UTC in snapshot.py)
    - cron: "0 6 * * *"
    - cron: "0 8-22/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Snapshot
        id: job
        continue-on-error: true
        run: PYTHONPATH=src python -m odds_analysis snapshot --raw-dir raw
      - name: Commit data
        if: always()
        run: scripts/commit_data.sh "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Upload raw responses (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-snapshot-${{ github.run_id }}
          path: raw/
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail if the job had errors
        if: steps.job.outcome != 'success'
        run: |
          echo "Snapshot job reported errors - see the 'Snapshot' step log and data/runs.csv"
          exit 1
