name: Results

on:
  schedule:
    # 05:04 UTC: finished matches of the last days -> scores, events, statistics, final odds, settlements
    - cron: "4 5 * * *"   # 05:04 UTC (off the top of the hour, which GitHub often drops)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start a follow-up run when the time budget is reached

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Results
        id: job
        continue-on-error: true
        run: PYTHONPATH=src python -m odds_analysis results --raw-dir raw
      - name: Commit data
        if: always()
        run: |
          scripts/commit_data.sh "data: results $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Publish exports (branch 'exports')
        id: export
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_exports.sh "export"
      - name: Start a follow-up run if the time budget was reached
        if: always() && hashFiles('.continue_results') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run results.yml --ref main
      - name: Continue the backfill (it pauses by itself when finished or out of minutes)
        if: always() && hashFiles('.continue_results') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backfill.yml --ref main
      - name: Upload raw responses (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-results-${{ github.run_id }}
          path: raw/
          retention-days: 7
          if-no-files-found: ignore
      - name: Fail if the job had errors
        if: steps.job.outcome != 'success' || steps.export.outcome != 'success'
        run: |
          echo "Results or export reported errors - see the step logs and data/runs.csv"
          exit 1
