name: Backfill

on:
  schedule:
    # Each job runs at most ~100 minutes and starts the next one until the backfill is finished or this month's
    # Actions minutes left drop below daily_reserve (config/backfill.yaml). The schedule restarts a stopped chain.
    - cron: "17 23 * * *"
    - cron: "17 1 * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # count this month's Actions minutes; start the next job

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        id: job
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python -m odds_analysis backfill
      - name: Commit data and progress
        if: always()
        run: |
          scripts/commit_data.sh "data: backfill $(date -u +%Y-%m-%dT%H:%MZ)"
      - name: Publish exports of the seasons this job touched
        id: export
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_exports.sh "export"
      - name: Start the next job (time limit reached, budget left)
        if: always() && hashFiles('.continue_backfill') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # Runs of the data-writer group wait in a queue of one: a newer waiting run cancels the older one, and
        # GitHub starts scheduled runs hours late. So after 05:00 UTC, if today's results run has not succeeded
        # (nor is running), the results run goes next; it starts the backfill again when it is done.
        run: scripts/next_data_job.sh
      - name: Fail if the job had errors
        if: steps.job.outcome != 'success' || steps.export.outcome != 'success'
        run: |
          echo "Backfill or export reported errors - see the step logs and data/runs.csv"
          exit 1
