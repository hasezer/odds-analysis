name: Weekly analysis

on:
  schedule:
    - cron: "37 7 * * 1"   # Mondays 07:37 UTC, after the 05:00 results run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyze (reports/ on main, analysis_summary.csv on the exports branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_exports.sh "analyze"
      - name: Commit report
        run: scripts/commit_data.sh "reports: weekly analysis $(date -u +%Y-%m-%d)"
