# Pipeline settings. Times are UTC unless noted; match dates/kickoffs from Mackolik lists are Turkey time (UTC+3).

# Snapshots (www.mackolik.com date listing + arsiv odds popup per match; 26 leagues, 45 markets)
snapshot:
  days_ahead: 10            # the morning run (06:07 UTC) lists today .. today+10 (Turkey dates)
  days_ahead_intraday: 2    # the other runs list today .. today+2
  # A match's odds are fetched (popup) the first time it is seen (opening_snapshot) and in the last run before its
  # kickoff (closing_snapshot = every selection): every run fetches the matches that kick off before the next
  # scheduled run + buffer. The 22:07 UTC run therefore covers night kickoffs until 06:07 UTC.
  buffer_minutes: 40        # runs start at :07 and can be delayed

# Results (05:04 UTC): finished matches of the last days
results:
  days_back: 5              # Turkey dates today-5 .. today
  min_minutes_after_kickoff: 150
  # Stop cleanly after this many minutes (job limit is 150): progress is saved and a follow-up run starts.
  max_minutes: 110

# Run status: a run is "failed" if more than this share of its requests still fail after the retries
# (5 s / 15 s / 45 s) or it saves no match although matches were due; some failed requests = "partial"
# (failed items go to data/failed_items.csv and data/retry_queue.csv and are retried by the next run).
runs:
  max_failed_share: 0.20

# Health (ok and partial runs count as successful)
health:
  max_hours_without_results: 48
  max_hours_without_snapshot: null   # snapshots paused while the backfill runs; set back to 12 when resuming


# Settlement rules for the SCHEMA.md tables (settlements.status)
# Collected markets: config/markets.yaml (no player bets, no card markets).
settlement:
  # seasons where Mackolik has no data for a family: its markets are "unsettleable"
  unsettleable:
    - {league_id: BEL-1, season: "2019/20", families: [corners]}   # no corner statistics for that season
