# The 26 leagues covered by backfill and daily collection (top divisions unless stated).
# league_id is our stable id (SCHEMA.md): <country>-<tier>; name_tr is Mackolik's name (country + competition).
# Included: regular season + the league's own playoff / relegation-playoff stages (they are stages of the same
# competition in the new mackolik.com API, e.g. Ligue 1 "Play-Out Final"). Cups are excluded.
#
# mackolik.competition_id : id in the new www.mackolik.com API (stable across seasons; livescores "competitionId")
# mackolik.code           : new-API competition code (NOT the same as the arsiv code)
# mackolik.slug           : URL slug for /puan-durumu/<slug>/<season>/fikstur/<competition_id>
# arsiv.code / arsiv.id   : arsiv.mackolik.com iddaa list league code and popLeague id. Verified by joining both
#                           systems on the iddaa code of the same match; null = not seen yet (the arsiv window was an
#                           international break). The pipeline fills them automatically - never guess them.
# calendar_year           : season label "2024" (true) or "2024/25" (false)
# split_from              : first season of a league that moved to an autumn-spring calendar
# extra                   : another new-API competition that stands in for the league in one season

