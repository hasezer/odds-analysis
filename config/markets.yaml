# The Nesine markets this project collects (user's selection, 2026-10-07). Everything else - player bets, card
# markets, first-half corners and every unlisted market - is dropped when a popup is read and never stored.
#
# key/line : the market as normalised by catalog.py (market_key without the line; line for Alt/Üst-type markets)
# label    : short Turkish column prefix in the one-row-per-match Excel view (column = label + selection)
# Order = column order in the view.

markets:
