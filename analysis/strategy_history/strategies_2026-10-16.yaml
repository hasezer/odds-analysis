built_on: '2026-10-16'
built_from: seasons 2024/25 + 2024 (find), 2025/26 + 2025 (confirm), 2026/27 + 2026 so far (exam)
lessons:
- 'No strategy beats Nesine''s prices in general: ML on all markets, 21M mined patterns, sure-bet scans, rule stacking and
  ''price + corrections'' all lost money on unseen seasons (reports: ML_REPORT, MINER_REPORT, RULES_V3_REPORT). Only exception
  so far: Portugal draw with 3+ goals (promising).'
- For hit rate on high-odds bets, the bet's own odds are the best filter (top 1% = 2.8x normal). Machine learning, rule counts
  and 'odds + corrections' were all worse on unseen seasons (HIGH_ODDS_REPORT).
- Rules raise hit rates 1.5-3x, but the odds fall with them; only ~17% of readable rules beat a plain odds filter of the same
  size, and confirmed rules do not hit more than the odds of their own matches predict.
- Team-level 'beats the price' effects do not persist from season to season (same count as shuffled data).
- League tendencies that beat the normal rate and the goal model every season still LOSE 10-25% at Nesine's real odds (Argentina
  draws, MLS away 3+, Bundesliga goals...). Only Portugal draw with 3+ goals made money every season; Ligue 1 half-time 'away
  ahead & both scored' is near break-even (+19.6 / -2.5 / -2.7).
- 'Rule hunt v4 (money scans, every bet type x odds band, Nesine''s cut, league, weekday, kick-off hour, month, season stage,
  rest days, league x odds): nothing made money in all three seasons except Portugal draws with 3+ goals (strongest at odds
  > 13.95) and a weak La Liga 1-1 slice; shuffled labels give ~0 (RULES_V4_REPORT).'
- 'Rule hunt v5 (new information): corners from team corner/cross/shot stats predict exactly as well as Nesine''s line (error
  2.68 vs 2.68) and corner bets need 61-70% to break even (lose 8-18%); teams'' first/second-half habits do not persist (correlation
  ~0); late-season motivation from rebuilt league tables shows no steady effect; popular teams (Turkey big 4, global giants)
  are NOT over-priced - their opponents lose 41-56%; a money scan of 915 non-odds conditions x 162 bet types (~148,000 cells)
  kept only Portugal draw with 3+ goals (shuffled: 0) (RULES_V5_REPORT).'
- 'Every bet type loses over time at Nesine''s closing odds: the least bad lose ~11-15 per 100 (both score in both halves,
  1st-half 1-1, BTTS yes, 2nd-half BTTS, low totals); correct scores lose ~47 on average and capped long shots 55-93; HT/FT
  ~26; corners ~18 (output/bet_type_returns.xlsx).'
- 'Owner''s tipster list (16 Oct 2026, tipster_rules.py, output/tipster_rules.xlsx): 21 of 22 rules testable; many raise the
  hit rate (e.g. 0-1 goals odds > 4.20 -> over 3.5: 42% vs 30%; HT score ''other'' < 5 & score ''other'' < 8 -> 6+ goals:
  23% vs 6%) but every rule stays below break-even (-8 to -33 per 100); ''all three half-by-half BTTS bets every game'' loses
  16%; the only plus (#21, HT/FT 2/1, +88) is 2 wins in 34 matches.'
- Team form, last match, market disagreement, calendar and Nesine's cut add only ~1 point of hit rate over odds.
- '''Fair price'' with the cut spread evenly is biased for short odds (Nesine has minimum odds): judge rules by the hit rate
  needed to break even at the odds paid, not by the ''fair'' chance.'
- 2026/27 (so far) has more goals than the odds expect in all leagues; it is not a yearly pattern (no month repeats it in
  2024/25 or 2025/26). Remove this drift before calling a rule 'beyond the odds'.
- 'Data traps: HT_2H_BTTS prices are label-swapped for 211 matches in Oct-Nov 2025 (excluded); 37 TUR-1 ''macko*'' placeholder
  fixtures (excluded); referee data is empty; odds movement exists for only ~11 settled matches.'
